name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-24.04

    steps:
      - name: 1. Checkout code
        uses: actions/checkout@v4

      - name: 2. Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 3. Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      - name: 4. Set up Flutter 3.29.0
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.29.0"
          channel: "stable"

      - name: 5. Accept Android Licenses & Install Flet
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          sudo apt-get update
          sudo apt-get install -y zip unzip libmpv-dev mpv libgtk-3-dev
          pip install --upgrade pip
          pip install "flet[all]==0.27.6" yt-dlp

      - name: 6. Build Android APK
        env:
          PYTHONUTF8: "1"
        run: |
          flet build apk --yes -v || flet build apk -v

      - name: 7. Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VideoDownloader-Android-APK
          path: build/apk/*.apk
