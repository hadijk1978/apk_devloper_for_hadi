name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-24.04

    steps:
      - name: 1. Checkout code
        uses: actions/checkout@v4

      - name: 2. Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 3. Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      - name: 4. Set up Flutter 3.24.5 (Exact match for Flet)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"
          channel: "stable"

      - name: 5. Accept Android Licenses & Install Flet
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          sudo apt-get update
          sudo apt-get install -y zip unzip libmpv-dev mpv
          pip install --upgrade pip
          pip install "flet==0.24.1" yt-dlp

      - name: 6. Build Android APK
        env:
          PYTHONUTF8: "1"
        run: |
          flet build apk -v --project "VideoDownloader" --org "com.mydownloader.app" --android-permissions android.permission.INTERNET=True android.permission.READ_EXTERNAL_STORAGE=True android.permission.WRITE_EXTERNAL_STORAGE=True

      - name: 7. Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VideoDownloader-Android-APK
          path: build/apk/*.apk
