name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-24.04

    steps:
      - name: 1. Checkout code
        uses: actions/checkout@v4

      - name: 2. Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 3. Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      - name: 4. Set up Flutter 3.24.5
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"
          channel: "stable"

      - name: 5. Accept Android Licenses & Install Flet 0.24.1
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
          pip install --upgrade pip
          pip install "flet==0.24.1" yt-dlp

      - name: 6. Prepare Fixed Flet Template & Build APK
        env:
          PYTHONUTF8: "1"
        run: |
          git clone --branch 0.24.1 --depth 1 https://github.com/flet-dev/flet-build-template.git /tmp/flet-template
          python3 -c '
          p = "/tmp/flet-template/{{cookiecutter.out_dir}}/pubspec.yaml"
          txt = open(p).read()
          txt = txt.replace("wakelock_plus: ^1.2.8", "wakelock_plus: 1.2.8")
          txt = txt.replace("package_info_plus: ^8.0.2", "package_info_plus: 8.0.2")
          txt += "\ndependency_overrides:\n  wakelock_plus: 1.2.8\n  package_info_plus: 8.0.2\n"
          open(p, "w").write(txt)
          print("Template pubspec.yaml locked to stable versions successfully!")
          '
          flet build apk -v --template-dir /tmp/flet-template

      - name: 7. Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VideoDownloader-Android-APK
          path: build/apk/*.apk
